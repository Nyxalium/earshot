[workspace]
resolver = "3"
members = ["crates/core", "crates/client", "crates/service", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-or-later"
repository = "https://github.com/Nyxalium/earshot"

[workspace.dependencies]
earshot-core = { path = "crates/core" }
earshot-client = { path = "crates/client" }
zbus = { version = "6", default-features = false, features = ["proxy", "service", "tokio"] }
tokio = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
